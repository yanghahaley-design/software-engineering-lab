name: Frontend CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check browser modules
        run: |
          node --check frontend/app.js
          node --check frontend/demo-api.js

      - name: Test static demo
        run: node --test tests/demo-api.test.mjs

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-bank-frontend
          path: frontend
          if-no-files-found: error
          retention-days: 14
